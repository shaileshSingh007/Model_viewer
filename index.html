<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Ed-Games Hub · 3D Animals</title>

<!-- model-viewer (works on Android Scene Viewer + iOS Quick Look) -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

<style>
  :root{
    --cream:#faf8ec;
    --orange:#e8ac4e;
    --ink:#33421f;
    --card:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;
    background:var(--orange);
    color:var(--ink);
    overflow-x:hidden;
  }

  /* ---------- Header ---------- */
  .topbar{
    background:var(--cream);
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
  }
  .logo-tcs{
    font-weight:800;
    font-size:clamp(22px,6vw,34px);
    letter-spacing:-1px;
    color:#111;
    line-height:1;
  }
  .logo-tcs span{position:relative;}
  .logo-tcs .o{
    display:inline-block;
    width:.62em;height:.62em;
    border:.12em solid #111;
    border-radius:50%;
    position:relative;
    top:.05em;
  }
  .logo-tcs .o::before{
    content:"";position:absolute;left:50%;top:-.18em;
    transform:translateX(-50%);
    width:.12em;height:.3em;background:#111;border-radius:2px;
  }
  .logo-hub{text-align:right;line-height:1.05;}
  .logo-hub b{
    display:block;
    font-size:clamp(20px,5.5vw,32px);
    letter-spacing:-1px;
    color:#111;
    font-weight:800;
  }
  .logo-hub small{
    display:block;
    font-size:clamp(8px,2.2vw,12px);
    color:#222;
    letter-spacing:.2px;
    margin-top:2px;
  }

  .banner{
    background:#000;
    color:#fff;
    padding:26px 20px;
    font-size:clamp(24px,7vw,42px);
    font-weight:400;
    letter-spacing:.5px;
  }

  /* ---------- Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:26px 22px;
    padding:34px 18px 90px;
    max-width:1200px;
    margin:0 auto;
  }
  @media(min-width:760px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr));} }
  @media(min-width:1080px){ .grid{grid-template-columns:repeat(4,minmax(0,1fr));} }

  .card{
    background:var(--card);
    padding:14px 14px 10px;
    border:none;
    cursor:pointer;
    box-shadow:6px 10px 18px rgba(0,0,0,.28);
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:transform .18s ease, box-shadow .18s ease;
    font-family:inherit;
  }
  .card:nth-child(odd){transform:rotate(-1.4deg);}
  .card:nth-child(even){transform:rotate(1.2deg);}
  .card:active{transform:scale(.97) rotate(0deg);}
  @media(hover:hover){
    .card:hover{transform:translateY(-4px) rotate(0deg);box-shadow:8px 14px 26px rgba(0,0,0,.35);}
  }

  .thumb{
    width:100%;
    aspect-ratio:1/1;
    background:radial-gradient(circle at 50% 40%, #8b8b90 0%, #6e6e74 60%, #5c5c62 100%);
    display:block;
    overflow:hidden;
    position:relative;
  }
  .thumb model-viewer{
    width:100%;height:100%;
    --poster-color:transparent;
    pointer-events:none;
    background:transparent;
  }
  .thumb .spin{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:12px;letter-spacing:1px;opacity:.8;
  }
  .card h3{
    margin:14px 4px 12px;
    font-size:clamp(18px,4.6vw,24px);
    font-weight:800;
    text-align:center;
    color:var(--ink);
    word-break:break-word;
    line-height:1.25;
  }

  /* ---------- Fullscreen viewer ---------- */
  .viewer{
    position:fixed;
    inset:0;
    background:#101216;
    z-index:9999;
    display:none;
  }
  .viewer.open{display:block;}
  .viewer model-viewer{
    width:100%;
    height:100%;
    background:linear-gradient(180deg,#20242c 0%,#0d0f13 100%);
    --progress-bar-color:#e8ac4e;
  }

  .close-btn{
    position:absolute;
    top:calc(env(safe-area-inset-top,0px) + 14px);
    right:14px;
    width:48px;height:48px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.92);
    color:#111;
    font-size:26px;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
    z-index:5;
  }
  .close-btn:active{transform:scale(.92);}

  .title-pill{
    position:absolute;
    top:calc(env(safe-area-inset-top,0px) + 20px);
    left:16px;
    background:rgba(0,0,0,.55);
    color:#fff;
    padding:8px 16px;
    border-radius:100px;
    font-size:16px;
    font-weight:700;
    backdrop-filter:blur(6px);
    z-index:5;
    max-width:60%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .ar-btn{
    position:absolute;
    bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    left:50%;
    transform:translateX(-50%);
    background:var(--orange);
    color:#231a06;
    border:none;
    padding:14px 26px;
    border-radius:100px;
    font-size:17px;
    font-weight:800;
    display:flex;align-items:center;gap:10px;
    box-shadow:0 8px 22px rgba(0,0,0,.45);
    cursor:pointer;
    z-index:5;
    white-space:nowrap;
  }
  .ar-btn:active{transform:translateX(-50%) scale(.95);}
  .ar-btn svg{width:22px;height:22px;}
  .ar-btn[hidden]{display:none;}

  .hint{
    position:absolute;
    bottom:calc(env(safe-area-inset-bottom,0px) + 92px);
    left:0;right:0;
    text-align:center;
    color:rgba(255,255,255,.7);
    font-size:13px;
    z-index:4;
    pointer-events:none;
  }

  .chat-fab{
    position:fixed;
    right:16px;
    bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
    width:62px;height:62px;
    border-radius:50%;
    background:#2f6fd0;
    border:none;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.35);
    z-index:50;
    cursor:pointer;
  }
  .chat-fab svg{width:30px;height:30px;fill:#fff;}
  .viewer.open ~ .chat-fab{display:none;}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo-tcs">tcs i<span class="o"></span>N</div>
  <div class="logo-hub">
    <b>Ed-Games Hub</b>
    <small>Built to engage learners at home and school</small>
  </div>
</header>

<div class="banner">Select to view and click pictures.</div>

<main class="grid" id="grid"></main>

<!-- Fullscreen AR / 3D viewer -->
<div class="viewer" id="viewer">
  <div class="title-pill" id="viewerTitle">Model</div>
  <button class="close-btn" id="closeBtn" aria-label="Close viewer">✕</button>
  <button class="close-btn" id="captureBtn" aria-label="Take Photo" style="right: 74px; font-size: 20px;">📷</button>
  <div class="hint">Drag to rotate · Pinch to zoom</div>
  <model-viewer
      id="mv"
      alt="3D model"
      camera-controls
      touch-action="none"
      auto-rotate
      auto-rotate-delay="1500"
      shadow-intensity="1"
      exposure="1"
      environment-image="neutral"
      ar
      ar-modes="scene-viewer quick-look webxr"
      ar-scale="fixed"
      ar-placement="floor"
      loading="eager"
      reveal="auto">
    <button class="ar-btn" slot="ar-button" id="arBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>
        <path d="M12 7.5 16.5 10v4.5L12 17l-4.5-2.5V10L12 7.5Z"/>
        <path d="M12 12.2 16.5 10M12 12.2 7.5 10M12 12.2V17"/>
      </svg>
      View in AR
    </button>
  </model-viewer>
</div>

<button class="chat-fab" aria-label="Chat">
  <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2Zm-3 10H7v-2h10v2Zm0-4H7V6h10v2Z"/></svg>
</button>

<script>
/* =========================================================
   1) MODEL LIST 
   Models are now loaded directly from the root folder.
   The .glb extension is appended to the animal's name automatically.
   ========================================================= */
const MODELS = [
  { name: "WhiteRhinoceros" },
  { name: "Giraffe" },
  { name: "Hippopotamus" },
  { name: "Wildebeest" },
  { name: "Elephant" },
  { name: "Zebra" },
  { name: "Lion" },
  { name: "Buffalo" }
];

/* ---------- Build the grid ---------- */
const grid = document.getElementById("grid");

MODELS.forEach((m) => {
  // Model file is named exactly the same as the animal name + .glb, loaded from root
  const src = `${m.name}.glb`; 
  
  const card = document.createElement("button");
  card.className = "card";
  card.type = "button";
  card.innerHTML = `
    <div class="thumb">
      <div class="spin">LOADING…</div>
      <model-viewer
        src="${src}"
        alt="${m.name}"
        loading="lazy"
        reveal="auto"
        interaction-prompt="none"
        disable-zoom
        disable-pan
        disable-tap
        camera-orbit="25deg 78deg auto"
        shadow-intensity="0.9"
        exposure="1"
        environment-image="neutral"></model-viewer>
    </div>
    <h3>${m.name}</h3>`;
    
  const tmv = card.querySelector("model-viewer");
  const spin = card.querySelector(".spin");
  
  tmv.addEventListener("load", () => spin.remove());
  tmv.addEventListener("error", () => spin.textContent = "3D");
  card.addEventListener("click", () => openViewer(m));
  
  grid.appendChild(card);
});

/* ---------- Fullscreen viewer ---------- */
const viewer      = document.getElementById("viewer");
const mv          = document.getElementById("mv");
const viewerTitle = document.getElementById("viewerTitle");
const closeBtn    = document.getElementById("closeBtn");
const arBtn       = document.getElementById("arBtn");
const captureBtn  = document.getElementById("captureBtn"); // Get the new button

captureBtn.addEventListener('click', async () => {
  try {
    // Generate a blob from the model-viewer
    const blob = await mv.toBlob({ idealAspect: true });
    
    // Create a temporary URL for the blob
    const url = URL.createObjectURL(blob);
    
    // Create a hidden anchor element to trigger the download
    const a = document.createElement('a');
    a.href = url;
    
    // Use the model name + timestamp for the filename
    const currentName = mv.getAttribute('alt') || 'Model';
    const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
    a.download = `${currentName}_capture_${timestamp}.png`;
    
    // Append, click, and cleanup
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    // Provide some visual feedback (optional flash effect)
    const flash = document.createElement('div');
    flash.style.position = 'absolute';
    flash.style.inset = '0';
    flash.style.backgroundColor = 'white';
    flash.style.zIndex = '99999';
    flash.style.transition = 'opacity 0.3s';
    viewer.appendChild(flash);
    
    setTimeout(() => {
      flash.style.opacity = '0';
      setTimeout(() => flash.remove(), 300);
    }, 50);

  } catch (error) {
    console.error("Failed to capture screenshot:", error);
  }
});

function openViewer(m){
  const src = `${m.name}.glb`;
  
  viewerTitle.textContent = m.name;
  mv.setAttribute("alt", m.name);
  mv.setAttribute("src", src); // Load from root
  
  // Optional: Auto-generate an iOS Quick Look filename if a matching .usdz is also in root
  // mv.setAttribute("ios-src", `${m.name}.usdz`); 
  mv.removeAttribute("ios-src");

  viewer.classList.add("open");
  document.body.style.overflow = "hidden";

  // reset camera each time
  mv.cameraOrbit = "20deg 75deg auto";
  mv.fieldOfView = "auto";
  try { mv.resetTurntableRotation(0); } catch(e){}

  // history entry so the hardware/gesture back button returns to the grid
  if (location.hash !== "#view") history.pushState({view:true}, "", "#view");

  // request real fullscreen where supported (Android/desktop; iOS ignores it)
  const el = viewer;
  if (el.requestFullscreen)      el.requestFullscreen().catch(()=>{});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}

function closeViewer(fromPop){
  viewer.classList.remove("open");
  document.body.style.overflow = "";
  mv.removeAttribute("src");                 // free GPU memory
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
  if (!fromPop && location.hash === "#view") history.back();
}

closeBtn.addEventListener("click", () => closeViewer(false));

window.addEventListener("popstate", () => {
  if (viewer.classList.contains("open")) closeViewer(true);
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && viewer.classList.contains("open")) closeViewer(false);
});

/* Hide the AR button on devices that cannot do AR (e.g. desktop) */
mv.addEventListener("load", () => {
  arBtn.hidden = !mv.canActivateAR;
});
</script>
</body>
</html>
